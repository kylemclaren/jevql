server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml text/javascript;

    # Astro emits a meta-refresh page for redirects; answer them here instead.
    location = /docs { return 301 /docs/introduction/; }
    location = /docs/ { return 301 /docs/introduction/; }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /install.sh {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
